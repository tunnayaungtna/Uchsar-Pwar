    <style id="merlion-neumorphism-css">
      :root {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        --neu-bg: #e6ecf5;
        --neu-surface: #eaf0f8;
        --neu-surface-hi: #f2f6fc;
        --neu-shadow-dark: #c2cee0;
        --neu-shadow-light: #ffffff;
        --neu-border-light: rgba(255, 255, 255, 0.78);
        --neu-border-dark: rgba(194, 206, 224, 0.45);
      }

      .dark {
        --neu-bg: #161b26;
        --neu-surface: #1b2230;
        --neu-surface-hi: #21293a;
        --neu-shadow-dark: #0d1017;
        --neu-shadow-light: #263044;
        --neu-border-light: rgba(255, 255, 255, 0.06);
        --neu-border-dark: rgba(0, 0, 0, 0.45);
      }

      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        margin: 0;
        padding: 0;
        background-color: var(--neu-bg);
      }

      .font-mono-tabular {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }

      .neu-app-bg {
        background: radial-gradient(circle at 15% 10%, var(--neu-surface-hi) 0%, var(--neu-bg) 70%);
      }

      .neu-header {
        background: color-mix(in srgb, var(--neu-surface) 92%, transparent);
        backdrop-filter: blur(16px);
        box-shadow: 0 6px 18px var(--neu-shadow-dark);
        border-bottom: 1px solid var(--neu-border-light);
      }

      .neu-bottom-nav {
        background: color-mix(in srgb, var(--neu-surface) 95%, transparent);
        backdrop-filter: blur(16px);
        box-shadow: 0 -6px 18px var(--neu-shadow-dark);
        border-top: 1px solid var(--neu-border-light);
      }

      .neu-card {
        background: linear-gradient(145deg, var(--neu-surface-hi), var(--neu-surface));
        box-shadow:
          10px 10px 22px var(--neu-shadow-dark),
          -10px -10px 22px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-light);
      }

      .neu-card-sm {
        background: linear-gradient(145deg, var(--neu-surface-hi), var(--neu-surface));
        box-shadow:
          5px 5px 12px var(--neu-shadow-dark),
          -5px -5px 12px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-light);
        transition: transform 0.16s ease, box-shadow 0.16s ease;
      }

      .neu-card-sm-interactive:hover {
        transform: translateY(-1px);
      }

      .neu-card-sm-interactive:active {
        transform: translateY(0);
        box-shadow:
          inset 3px 3px 7px var(--neu-shadow-dark),
          inset -3px -3px 7px var(--neu-shadow-light);
      }

      .neu-inset {
        background: var(--neu-bg);
        box-shadow:
          inset 5px 5px 11px var(--neu-shadow-dark),
          inset -5px -5px 11px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-dark);
      }

      .neu-inset-sm {
        background: var(--neu-bg);
        box-shadow:
          inset 3px 3px 7px var(--neu-shadow-dark),
          inset -3px -3px 7px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-dark);
      }

      .neu-emerald-well {
        background: linear-gradient(145deg, rgba(16, 185, 129, 0.11), rgba(5, 150, 105, 0.04));
        box-shadow:
          inset 4px 4px 10px var(--neu-shadow-dark),
          inset -4px -4px 10px var(--neu-shadow-light);
        border: 1px solid rgba(16, 185, 129, 0.28);
      }

      .neu-emerald-card {
        background: linear-gradient(145deg, rgba(16, 185, 129, 0.14), rgba(5, 150, 105, 0.05));
        box-shadow:
          5px 5px 12px var(--neu-shadow-dark),
          -5px -5px 12px var(--neu-shadow-light);
        border: 1px solid rgba(16, 185, 129, 0.35);
      }

      .neu-input {
        background: var(--neu-bg);
        box-shadow:
          inset 4px 4px 8px var(--neu-shadow-dark),
          inset -4px -4px 8px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-dark);
        transition: box-shadow 0.18s ease, border-color 0.18s ease;
      }

      .neu-input:focus {
        outline: none;
        border-color: rgba(16, 185, 129, 0.65);
        box-shadow:
          inset 4px 4px 8px var(--neu-shadow-dark),
          inset -4px -4px 8px var(--neu-shadow-light),
          0 0 0 2px rgba(16, 185, 129, 0.18);
      }

      .neu-btn {
        background: linear-gradient(145deg, var(--neu-surface-hi), var(--neu-surface));
        box-shadow:
          4px 4px 10px var(--neu-shadow-dark),
          -4px -4px 10px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-light);
        transition: all 0.15s ease;
      }

      .neu-btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .neu-btn:active:not(:disabled),
      .neu-btn-pressed {
        transform: translateY(0);
        background: var(--neu-bg);
        box-shadow:
          inset 3px 3px 7px var(--neu-shadow-dark),
          inset -3px -3px 7px var(--neu-shadow-light);
      }

      .neu-btn-primary {
        background: linear-gradient(145deg, #10b981, #059669);
        color: #ffffff;
        box-shadow:
          5px 5px 12px var(--neu-shadow-dark),
          -4px -4px 10px var(--neu-shadow-light),
          inset 1px 1px 1px rgba(255, 255, 255, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.15s ease;
      }

      .neu-btn-primary:hover:not(:disabled) {
        background: linear-gradient(145deg, #0ea572, #047857);
        transform: translateY(-1px);
      }

      .neu-btn-primary:active:not(:disabled) {
        transform: translateY(0);
        box-shadow:
          inset 3px 3px 7px rgba(0, 0, 0, 0.35),
          inset -2px -2px 5px rgba(255, 255, 255, 0.15);
      }

      .neu-segment-active {
        background: linear-gradient(145deg, var(--neu-surface-hi), var(--neu-surface));
        box-shadow:
          3px 3px 7px var(--neu-shadow-dark),
          -3px -3px 7px var(--neu-shadow-light);
        border: 1px solid var(--neu-border-light);
      }

      .neu-icon-frame {
        background: linear-gradient(145deg, var(--neu-surface-hi), var(--neu-surface));

    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('uchsar-pwa-prompt-ready'));
      });
      (function () {
        var CURRENT_CACHE = 'uchsar-pwar-pwa-v6';
        if ('caches' in window) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (key) {
                if (key !== CURRENT_CACHE) {
                  caches.delete(key);
                }
              });
            })
            .catch(function () {});
        }

        var primaryIcon = './assets/aistudio/my_walet_40feb1c8.png';
        var fallbackIcon = './public/assets/aistudio/my_walet_40feb1c8.png';

        function applySquareIconFromImage(img) {
          try {
            var size = 512;
            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext('2d');
            if (!ctx) return;
            ctx.fillStyle = '#073b4c';
            ctx.fillRect(0, 0, size, size);
            var scale = Math.min(size / img.naturalWidth, size / img.naturalHeight);
            var drawW = Math.round(img.naturalWidth * scale);
            var drawH = Math.round(img.naturalHeight * scale);
            var offsetX = Math.round((size - drawW) / 2);
            var offsetY = Math.round((size - drawH) / 2);
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
            var squareDataUrl = canvas.toDataURL('image/png');
            var fav = document.getElementById('app-favicon');
            var touch = document.getElementById('app-touch-icon');
            if (fav) fav.href = squareDataUrl;
            if (touch) touch.href = squareDataUrl;
          } catch (err) {
            // ignore canvas errors
          }
        }

        var testImg = new Image();
        testImg.crossOrigin = 'anonymous';
        testImg.onload = function () {
          applySquareIconFromImage(testImg);
        };
        testImg.onerror = function () {
          if (!testImg.dataset.fallback) {
            testImg.dataset.fallback = '1';
            testImg.src = fallbackIcon;
          }
        };
        testImg.src = primaryIcon;

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker
              .register('./sw.js?v=6', { scope: './', updateViaCache: 'none' })
              .then(function (reg) {
                reg.update().catch(function () {});
              })
              .catch(function () {});
          });
        }
      })();
    </script>
    <script>
      window.__bootGitHubPagesSource = async function () {
        if (
          window.__UCHSAR_PWAR_MOUNTED__ ||
          window.__UCHSAR_PWAR_BOOTING__ ||
          window.__IS_VITE_DIST_BUILD__
        ) {
          return;
        }
        window.__UCHSAR_PWAR_BOOTING__ = true;

        function loadScript(src, fallbackSrc) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = function () {
              if (fallbackSrc) {
                var s2 = document.createElement('script');
                s2.src = fallbackSrc;
                s2.onload = resolve;
                s2.onerror = reject;
                document.head.appendChild(s2);
              } else {
                reject(new Error('Failed to load script: ' + src));
              }
            };
            document.head.appendChild(s);
          });
        }

        function toBlobUrl(jsCode) {
          return URL.createObjectURL(new Blob([jsCode], { type: 'text/javascript' }));
        }

        var rootLoading = document.getElementById('root');
        if (rootLoading && !rootLoading.innerHTML.trim()) {
          rootLoading.innerHTML =
            '<div class="neu-app-bg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#059669;font-size:14px;font-weight:700;">ဥစ္စာပွား (Uchsar Pwar) ဖွင့်နေပါသည်...</div>';
        }

        try {
          var baseNeuCssEl = document.getElementById('merlion-neumorphism-css');
          var baseNeuCss = baseNeuCssEl ? baseNeuCssEl.textContent || '' : '';

          var twStyle = document.createElement('style');
          twStyle.setAttribute('type', 'text/tailwindcss');
          twStyle.textContent =
            '@import "tailwindcss";\n@custom-variant dark (&:where(.dark, .dark *));\n' +
            baseNeuCss;
          document.head.appendChild(twStyle);

          await Promise.all([
            loadScript(
              'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4',
              'https://unpkg.com/@tailwindcss/browser@4'
            ).catch(function () {}),
            loadScript(
              'https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js',
              'https://unpkg.com/@babel/standalone@7.26.9/babel.min.js'
            ),
          ]);

          async function fetchText(relPath) {
            var bustUrl = relPath + (relPath.indexOf('?') === -1 ? '?v=6' : '&v=6');
            var res = null;
            try {
              res = await fetch(bustUrl, { cache: 'no-cache' });
            } catch (e) {
              res = null;
            }
            if (!res || !res.ok) {
              res = await fetch(relPath);
            }
            if (!res || !res.ok) {
              throw new Error('Failed to load ' + relPath);
            }
            return await res.text();
          }

          function transpileTsx(source, filename) {
            return window.Babel.transform(source, {
              filename: filename,
              presets: [
                ['typescript', { isTSX: true, allExtensions: true }],
                ['react', { runtime: 'classic' }],
              ],
            }).code;
          }

          var rawFiles = await Promise.all([
            fetchText('./firebase-applet-config.json'),
            fetchText('./src/types.ts'),
            fetchText('./src/utils/sampleData.ts'),
            fetchText('./src/utils/webauthn.ts'),
            fetchText('./src/firebase.ts'),
            fetchText('./src/components/BiometricLockScreen.tsx'),
            fetchText('./src/components/EntryFormModal.tsx'),
            fetchText('./src/components/ErrorBoundary.tsx'),
            fetchText('./src/App.tsx'),
            fetchText('./src/main.tsx'),
          ]);

          var configUrl = toBlobUrl('export default ' + rawFiles[0] + ';');
          var typesUrl = toBlobUrl(transpileTsx(rawFiles[1], 'types.ts'));
          var sampleDataUrl = toBlobUrl(
            transpileTsx(
              rawFiles[2].replace(/from\s+['"]\.\.\/types['"]/g, 'from "' + typesUrl + '"'),
              'sampleData.ts'
            )
          );
          var webauthnUrl = toBlobUrl(transpileTsx(rawFiles[3], 'webauthn.ts'));
          var firebaseUrl = toBlobUrl(
            transpileTsx(
              rawFiles[4].replace(
                /from\s+['"]\.\.\/firebase-applet-config\.json['"]/g,
                'from "' + configUrl + '"'
              ),
              'firebase.ts'
            )
          );
          var lockScreenUrl = toBlobUrl(
            transpileTsx(
              rawFiles[5].replace(
                /from\s+['"]\.\.\/utils\/webauthn['"]/g,
                'from "' + webauthnUrl + '"'
              ),
              'BiometricLockScreen.tsx'
            )
          );
          var modalUrl = toBlobUrl(
            transpileTsx(
              rawFiles[6].replace(/from\s+['"]\.\.\/types['"]/g, 'from "' + typesUrl + '"'),
              'EntryFormModal.tsx'
            )
          );
          var errorBoundaryUrl = toBlobUrl(transpileTsx(rawFiles[7], 'ErrorBoundary.tsx'));

          var appSource = rawFiles[8]
            .replace(/from\s+['"]\.\/firebase['"]/g, 'from "' + firebaseUrl + '"')
            .replace(/from\s+['"]\.\/types['"]/g, 'from "' + typesUrl + '"')
            .replace(/from\s+['"]\.\/utils\/sampleData['"]/g, 'from "' + sampleDataUrl + '"')
            .replace(/from\s+['"]\.\/utils\/webauthn['"]/g, 'from "' + webauthnUrl + '"')
            .replace(
              /from\s+['"]\.\/components\/BiometricLockScreen['"]/g,
              'from "' + lockScreenUrl + '"'
            )
            .replace(
              /from\s+['"]\.\/components\/EntryFormModal['"]/g,
              'from "' + modalUrl + '"'
            );
          var appUrl = toBlobUrl(transpileTsx(appSource, 'App.tsx'));

          var mainSource = rawFiles[9]
            .replace(/import\s+['"]\.\/index\.css['"];?/g, '')
            .replace(/from\s+['"]\.\/App(?:\.tsx)?['"]/g, 'from "' + appUrl + '"')
            .replace(
              /from\s+['"]\.\/components\/ErrorBoundary(?:\.tsx)?['"]/g,
              'from "' + errorBoundaryUrl + '"'
            );
          var mainUrl = toBlobUrl(transpileTsx(mainSource, 'main.tsx'));

          var modScript = document.createElement('script');
          modScript.type = 'module';
          modScript.src = mainUrl;
          document.body.appendChild(modScript);
        } catch (err) {
          console.error('GitHub Pages Bootstrap Error:', err);
          var rootEl = document.getElementById('root');
          if (rootEl && !window.__UCHSAR_PWAR_MOUNTED__) {
            rootEl.innerHTML =
              '<div style="padding:24px;font-family:sans-serif;max-width:480px;margin:40px auto;border:1px solid #fecaca;background:#fef2f2;border-radius:16px;color:#991b1b;font-size:13px;">' +
              '<strong>GitHub Pages Loading Error:</strong><br/>' +
              String(err && err.message ? err.message : err) +
              '</div>';
          }
        }
      };
    </script>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        var hasViteBundle =
          !!window.__IS_VITE_DIST_BUILD__ ||
          !!document.querySelector('script[src*="./assets/app"]');
        if (hasViteBundle) {
          return;
        }
        if (window.location.hostname.endsWith('github.io')) {
          window.__bootGitHubPagesSource();
        } else {
          window.addEventListener('load', function () {
            setTimeout(function () {
              if (!window.__UCHSAR_PWAR_MOUNTED__ && !window.__IS_VITE_DIST_BUILD__) {
                window.__bootGitHubPagesSource();
              }
            }, 1200);
          });
        }
      })();
